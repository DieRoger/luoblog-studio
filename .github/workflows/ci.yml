name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint, typecheck, test
  # ---------------------------------------------------------------------------
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: luoblog
          POSTGRES_PASSWORD: luoblog
          POSTGRES_DB: luoblog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Mypy (type check)
        run: mypy src/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://luoblog:luoblog@localhost:5432/luoblog_test
        run: pytest ../../tests/ -v

  # ---------------------------------------------------------------------------
  # Frontend — lint, typecheck, build
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-optional

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
