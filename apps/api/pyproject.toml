[project]
name = "luoblog-api"
version = "0.1.0"
description = "LuoBlog Studio — Personal AI Engineering Knowledge OS"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "litellm>=1.40.0",
    "langgraph>=0.2.0",
    "structlog>=24.0.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "mistune>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # FastAPI Depends() pattern (not a real bug)
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/persistence/repositories.py" = ["F821"]
"src/domain/repositories.py" = ["F821"]
"src/services/chunking.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["type-arg", "no-any-return", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "src.infrastructure.persistence.repositories"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.domain.repositories"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.infrastructure.parsing.pdf_parser"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.infrastructure.embedding.local_bge"
ignore_missing_imports = true
