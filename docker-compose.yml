# =============================================================================
# LuoBlog Studio — Docker Compose (Development)
# =============================================================================
# Usage:
#   docker compose up -d              # start all services
#   docker compose down -v            # stop and remove volumes
#   docker compose exec api bash      # shell into API container

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15 + PGVector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: luoblog-postgres
    environment:
      POSTGRES_USER: luoblog
      POSTGRES_PASSWORD: luoblog
      POSTGRES_DB: luoblog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luoblog -d luoblog"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: development
    container_name: luoblog-api
    command: uvicorn src.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://luoblog:luoblog@postgres:5432/luoblog
      DATABASE_SYNC_URL: postgresql://luoblog:luoblog@postgres:5432/luoblog
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - ./agents:/agents
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
